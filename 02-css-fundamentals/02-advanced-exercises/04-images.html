<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes</title>
    <!-- https://techicons.dev/icons/react -->
</head>
<body>

    <!-- Etiquetas de Bloque y Etiquetas de Línea -->

    <h1>Imágenes</h1>

    <!-- Una imagen es un elemento en el documento HTML. -->

    <!-- Una imagen se representa en HTML mediante la etiqueta img. Esta etiqueta es un elemento vacío, lo que significa que no tiene una etiqueta de cierre. La sintaxis básica para insertar una imagen es: -->

    <!-- src: es la ruta donde se encuentra la imagen -->

    <!-- alt: (alternative text) es muy importante para que proporciona una descripción textual de la imagen para accesibilidad y como fallback si no se carga. El texto alternativo debe ser descriptivo y conciso, y debe transmitir la información esencial que la imagen representa. -->

    <img src="04_imagen.png" alt="Logotipo de HTML5" title="HTML5" width="200" height="200">

    <!-- Self Closing Tags en etiquetas que se autocierran -->
    
</body>
</html>
