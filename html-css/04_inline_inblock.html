<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque vs Linea - Guia Visual</title>
</head>
<body>
    
    <style>
        body {
            font-family: sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 20px auto;
            color: #333;
        }

        /* Estilo para Elementos de Bloque */
        .ejemplo-bloque {
            background-color: #ffe0e0;
            border: 2px solid #ff5f5f;
            margin: 10px 0;
            padding: 10px;
        }

        /* Estilo para elemento en linea */
        .ejemplo-inline {
            background-color: #e0f0ff;
            border: 2px solid #5fb2ff;
            padding: 2px 5px;
        }


    </style>



</body>
</html>
